<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Arcade Time | Inicio de sesion</title>

</head>


<body>


    <!-- fondo gral de los fantasmitas -->
    <div class="fondo-pagina">



        <main class="pagina-login">



            <!-- div para centrar el login -->
            <div class="pagina-login__contenedor">



                <!-- contenedor rosa -->
                <section
                    class="login"
                    aria-labelledby="titulo-login"
                >



                    <!-- encabezado del login -->
                    <div class="login__encabezado">


                        <h1
                            class="login__titulo"
                            id="titulo-login"
                        >
                            Inicio de sesión
                        </h1>



                        <p class="login__descripcion">

                            Inicia sesión con tu cuenta de

                            <strong>Arcade Time.</strong>

                        </p>


                    </div>





                    <!-- form de inicio de sesion -->
                    <form
                        class="formulario-login"
                        action="#"
                        method="post"
                    >



                        <!-- campo email -->
                        <div class="campo-formulario">



                            <label
                                class="campo-formulario__etiqueta"
                                for="email"
                            >
                                Email
                            </label>



                            <!-- container del input, para poder mostrar la validacion con un icono -->
                            <div class="campo-formulario__contenedor-input">



                                <input
                                    class="campo-formulario__input"
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="usuario@emailpropio.com"
                                    autocomplete="email"
                                    required
                                >



                                <!-- indicador de validacion, desp puede mostrase/ocultarse desde css y js -->
                                <div
                                    class="campo-formulario__estado"
                                    aria-hidden="true"
                                ></div>



                            </div>


                        </div>





                        <!-- campo contraseña -->
                        <div class="campo-formulario">



                            <label
                                class="campo-formulario__etiqueta"
                                for="contrasena"
                            >
                                Contraseña
                            </label>



                            <div class="campo-formulario__contenedor-input">



                                <input
                                    class="campo-formulario__input"
                                    type="password"
                                    id="contrasena"
                                    name="contrasena"
                                    placeholder="****************"
                                    autocomplete="current-password"
                                    required
                                >



                            </div>


                        </div>





                        <!-- boton iniciar sesion -->
                        <div class="formulario-login__contenedor-boton">


                            <button
                                class="boton boton--principal"
                                type="submit"
                            >
                                Iniciar sesión
                            </button>


                        </div>



                    </form>





                    <!-- link a registro -->
                    <div class="login__registro">


                        <p class="login__registro-texto">

                            ¿No tienes cuenta?

                            <a
                                class="login__registro-link"
                                href="registro.html"
                            >
                                Regístrate.
                            </a>


                        </p>


                    </div>



                </section>



            </div>



        </main>



    </div>


</body>

</html>
